[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Spidy394", email = "mondalshubhodeep30924@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi[standard]>=0.165.0",
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
backend = "app:main"
dev = "app._dev:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

